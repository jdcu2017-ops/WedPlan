version: "3.9"
services:
  postgres:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: wedplan
      POSTGRES_PASSWORD: wedplan_dev_password
      POSTGRES_DB: wedplan
    ports:
      - "5432:5432"
    volumes:
      - wedplan_pgdata:/var/lib/postgresql/data

  redis:
    image: redis:7
    restart: unless-stopped
    ports:
      - "6379:6379"

volumes:
  wedplan_pgdata:
